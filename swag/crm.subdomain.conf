## LinuxServer SWAG reverse proxy configuration for TalkCRM
## Save this file as: /config/nginx/proxy-confs/crm.subdomain.conf inside your SWAG container

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name crm.platinumcom.us;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    # Option A: If SWAG and TalkCRM share the same Docker network (recommended)
    # set $upstream_app talkcrm;
    # set $upstream_port 3000;

    # Option B: If SWAG connects via your OMV server's host IP
    set $upstream_app talkcrm;
    set $upstream_port 3000;
    set $upstream_proto http;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # WebSockets support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # CRITICAL: Server-Sent Events (SSE) for Real-Time UniFi Talk Call Screen-Pops
    location /api/events {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # Disable buffering so call popups arrive instantly without delay
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
